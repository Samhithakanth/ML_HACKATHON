server:
  host: "0.0.0.0"
  port: 8000
  title: "PathSnap Map-Matching & Route Reconstruction API"
  version: "1.0.0"

paths:
  data_dir: "Student folder"
  eval_partition: "student_test"
  train_partition: "train"
  model_path: "models/lightgbm_tuned.joblib"
  scaler_path: "models/scaler.joblib"
  hmm_config: "configs/hmm.yaml"
  log_file: "logs/api.log"

pipeline:
  # candidates: R = 100 m, K = 30 (src.data.candidates.candidate_table), shared with training
  max_candidates: 30
  spatial_search_k: 30
  network_buffer_m: 150.0
  max_network_segments: 25000
  gps_gap_threshold_s: 5.0
  use_stub: false # toggle true to run stub nearest-arc baseline
